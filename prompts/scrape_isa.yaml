id: scrap_isa
description: >
  Extract a single ISA (Povos Indígenas no Brasil) wiki page into a flat JSON object.

model:
  provider: openai
  name: gpt-5-mini-2025-08-07
  temperature: 1.0
  seed: 19

system: |
  Você é uma assistente de pesquisa meticulosa. Siga as instruções com precisão e produza exatamente o que é solicitado, sem comentários extras.
  Sua tarefa agora é extrair **apenas um** verbete do ISA (Povos Indígenas no Brasil), usando a URL e o nome do povo fornecidos.

user: |
  Visite o seguinte URL: {isa_url}
  O nome da etnia é: {ethnicity}

  Instruções:
    • Acesse a página do verbete na URL acima e use **apenas** as informações contidas nessa página.
    • Retorne um único objeto JSON com **quatro** chaves exatamente: "name", "other_names", "summary", "location".
    • Os valores **não** devem ser listas. Cada chave deve ter um único valor de string (UTF-8).
      - "name": use exatamente o valor {ethnicity} (preserve diacríticos).
      - "other_names": sinônimos/exônimos encontrados na página, separados por vírgulas em **uma única string**; se não houver, use string vazia "".
      - "summary": síntese concisa (1-3 frases) **em português**, baseada somente na página referida (sem copiar listas integrais, sem notas de rodapé).
      - "location": siglas de estados brasileiros, separadas por vírgula **com espaços** (ex.: "RO" ou "AM, RO"); se não aplicável, use "".
    • O JSON deve ser estrito e válido (sem vírgulas finais, sem Markdown, sem texto antes/depois).

  Saída esperada (exemplo de formato, não use estes dados):
    {{
      "name": "{ethnicity}",
      "other_names": "Exônimo 1, Exônimo 2",
      "summary": "Frase 1. Frase 2.",
      "location": "RO, AM"
    }}
