id: scrap_isa
description: >
  Extract a single ISA (Povos Indígenas no Brasil) wiki page into a flat JSON object.

model:
  provider: openai
  name: gpt-5-mini-2025-08-07
  temperature: 1.0
  seed: 19

system: |
  Você é uma assistente de pesquisa meticulosa. Siga as instruções com precisão e produza exatamente o que é solicitado, sem comentários extras.
  Sua tarefa agora é extrair **apenas um** verbete do ISA (Povos Indígenas no Brasil), usando a URL e o nome do povo fornecidos.

user: |
  O nome da etnia é: {ethnicity}

  Instruções:
    • Leia o texto extraido de um website abaixo e use **apenas** essas informações para completar as seguintes tarefas.
    • Retorne um único objeto JSON com **quatro** chaves exatamente: "name", "other_names", "summary", "location".
    • Os valores **não** devem ser listas. Cada chave deve ter um único valor de string (UTF-8).
      - "name": use exatamente o nome da etnia (preserve diacríticos).
      - "other_names": sinônimos/exônimos encontrados na página, separados por vírgulas em **uma única string**; se não houver, use string vazia "".
      - "summary": síntese concisa (1 parágrafo) **em português**, baseada somente na página referida (sem copiar listas integrais, sem notas de rodapé).
      - "location": **apenas** siglas de UFs brasileiras (ex.: "RO" ou "AM, RO"), separadas por vírgula + espaço. Se não houver referência, use "".
    • Regras específicas para "location" (siga a ordem):
      1) Procure o bloco do topo que contém os rótulos "Autodenominação", "Onde estão", "Quantos são".
         - Extraia **somente** o conteúdo imediatamente associado a "Onde estão".
         - Se encontrar UFs (ex.: "PA", "AM"), use-as diretamente.
      2) Se (1) não retornar nada, vasculhe o texto por menções **explícitas** de UFs (padrão: duas letras maiúsculas isoladas, p.ex. /\b[A-Z]{{2}}\b/).
      3) Se não houver UFs, procure **nomes de UFs por extenso** (p.ex., "Pará", "Amazonas", "Rondônia", etc.) e **normalize** usando a TABELA UF abaixo.
      4) Se ainda assim não houver, procure **municípios ou TIs** mencionados e, se o texto indicar de forma inequívoca o estado (ex.: "no sudeste do Pará"), normalize para a UF correspondente.
      5) **Nunca adivinhe**. Se nenhuma regra retornar resultado inequívoco, defina "location": "".
    • TABELA UF (normalização de nomes por extenso → siglas, aplique case-insensitive):
      Acre→AC; Alagoas→AL; Amapá→AP; Amazonas→AM; Bahia→BA; Ceará→CE; Distrito Federal→DF;
      Espírito Santo→ES; Goiás→GO; Maranhão→MA; Mato Grosso→MT; Mato Grosso do Sul→MS;
      Minas Gerais→MG; Pará→PA; Paraíba→PB; Paraná→PR; Pernambuco→PE; Piauí→PI; Rio de Janeiro→RJ;
      Rio Grande do Norte→RN; Rio Grande do Sul→RS; Rondônia→RO; Roraima→RR; Santa Catarina→SC;
      São Paulo→SP; Sergipe→SE; Tocantins→TO.
    • Tratamento:
      - Colete todas as UFs encontradas pelas regras acima, remova duplicadas, **ordene alfabeticamente pelo código** e junte com ", ".
      - Não inclua outras informações (ex.: números populacionais próximos a "Onde estão").
      - Siga estritamente a ortografia de siglas (duas letras maiúsculas).
    • O JSON deve ser estrito e válido (sem vírgulas finais, sem Markdown, sem texto antes/depois).

  Saída esperada (exemplo de formato, não use estes dados):
    {{
      "name": "Apurinã",
      "other_names": "Exônimo 1, Exônimo 2",
      "summary": "Frase 1. Frase 2.",
      "location": "AM, MT, RO"
    }}

    Text do website:
      {isa_url_text}

    
